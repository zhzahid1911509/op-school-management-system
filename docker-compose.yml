services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admission_local}
    volumes:
      - admission-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Admission: "${ADMISSION_CONNECTION_STRING:-Host=db;Database=admission;Username=admission;Password=${POSTGRES_PASSWORD:-admission_local}}"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      FrontendOrigin: ${FRONTEND_ORIGIN:-http://localhost:3000}
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
volumes:
  admission-data:
